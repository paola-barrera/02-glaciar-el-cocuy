name: glaciar-cocuy
channels:
  - conda-forge
dependencies:
  - python=3.11
  - ipykernel          # para ejecutar celdas en VS Code por celdas
  - earthengine-api    # acceso a Google Earth Engine desde Python {ee}
  - geemap             # mapas interactivos de GEE {geemap}
  - pandas             # tablas de datos {pandas}
  - numpy              # cálculos con arreglos {numpy}
  - rasterio           # leer y escribir rásters (GeoTIFF) {rasterio}
